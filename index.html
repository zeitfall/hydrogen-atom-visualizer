<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hydrogen Atom Visualizer</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="styles.css" />
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
                    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
                    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
                    "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js"
                }
            }
        </script>
    </head>
    <body>
        <canvas id="viewport"></canvas>
        <div id="hud"></div>
        <div id="sidebar">
            <div id="metrics" class="scaled-pane"></div>
            <div id="convergence"></div>
            <button id="show-all-states" class="sidebar-button" type="button">Show all states</button>
        </div>
        <div id="results" hidden></div>
        <div id="panel"><div id="pane" class="scaled-pane"></div></div>
        <div id="status" hidden></div>
        <script type="module" src="src/main.js"></script>
    </body>
</html>
